name: barberapp_yucatan
description: "Aplicación de reservas para barberías en Yucatán"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # ✅ UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  smooth_page_indicator: ^1.1.0

  # ✅ NETWORKING
  http: ^1.2.0
  dio: ^5.4.0
  connectivity_plus: ^6.0.3

  # ✅ ALMACENAMIENTO
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # ✅ STATE MANAGEMENT
  provider: ^6.1.1

  # ✅ NAVEGACIÓN
  go_router: ^13.0.1

  # ✅ FORMULARIOS Y FECHAS
  image_picker: ^1.0.7
  intl: ^0.19.0

  # ✅ NOTIFICACIONES PUSH
  firebase_messaging: ^14.8.0
  flutter_local_notifications: ^17.0.0

  # ✅ PERMISOS
  permission_handler: ^11.3.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true